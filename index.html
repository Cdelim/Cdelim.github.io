<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cem Bektaşoğlu – Games</title>
  <meta name="description" content="Mobile games by Cem Bektaşoğlu.">
  <style>
    :root { --navy:#1E2A3A; --cream:#FFF4DF; --coral:#F2694B; --teal:#1E9C8F; --bg:#F4EBDD; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--navy); }
    main { max-width: 760px; margin: 48px auto; padding: 0 20px 48px; }
    h1 { margin: 0 0 4px; font-size: 40px; }
    .lead { margin: 0 0 32px; opacity: .8; }
    .game { display: block; background: var(--cream); border: 3px solid var(--navy); border-radius: 22px; padding: 22px 24px; margin-bottom: 18px; }
    .game h2 { margin: 0 0 6px; color: var(--coral); font-size: 26px; }
    .game p { margin: 0 0 12px; line-height: 1.5; }
    .links a { margin-right: 18px; }
    a { color: var(--teal); font-weight: 600; }
    footer { margin-top: 32px; font-size: 14px; opacity: .8; }
  </style>
</head>
<body>
  <main>
    <h1>Cem Bektaşoğlu</h1>
    <p class="lead">Mobile games for iOS and Android.</p>

    <section class="game">
      <h2>Junction Jam</h2>
      <p>A traffic puzzle: plan the order the cars cross the intersection, press GO, and watch it flow.</p>
      <p class="links"><a href="junction-jam/">Game page</a><a href="junction-jam/privacy-policy.html">Privacy policy</a></p>
    </section>

    <footer>Contact: <a href="mailto:cembektasoglu7@gmail.com">cembektasoglu7@gmail.com</a> · © 2026 Cem Bektaşoğlu</footer>
  </main>
</body>
</html>
